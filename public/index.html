<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POME工会 - 剑术PVP排行榜</title>
<link rel="icon" href="favicon.ico" type="image/x-icon">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">

<style>
:root {
    --bg-color: #0a0a0f;
    --border-color: rgba(0, 200, 255, 0.4);
    --text-primary: #e0e0ff;
    --text-secondary: #8888aa;
    --gold: #ffd700;
    --silver: #c0c0c0;
    --bronze: #cd7f32;
    --elite-gradient: linear-gradient(90deg, #ff4d4d, #f9cb28, #4cd964, #5ac8fa, #ff2d55);
    --glitch-color-1: #ff0000;
    --glitch-color-2: #ffffff;
    --rank-other-color: #00e5ff;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

/* 背景图 */
body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    color: var(--text-primary);
    min-height: 100vh;
    padding: 40px 20px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    position: relative;
    overflow-x: hidden;
}

.bg-img {
    position: fixed; top: 0; left: 0;
    width: 100vw; height: 100vh;
    object-fit: cover; z-index: -2;
    content: url('https://i.ibb.co/Kxr0Y8Zs/d19aa69cab84a3d11ea0d08dd4b9680c23a76ad4.jpg');
}
.bg-overlay {
    position: fixed; inset: 0;
    background: rgba(10, 10, 20, 0.25); z-index: -1;
}
@media (max-width: 850px) and (aspect-ratio: 16/9),
       (max-width: 850px) and (aspect-ratio: 18/9) {
    .bg-img { content: url('https://i.ibb.co/Kxr0Y8Zs/d19aa69cab84a3d11ea0d08dd4b9680c23a76ad4.jpg'); }
}
@media (max-width: 768px) and (orientation: portrait) {
    .bg-img { content: url('https://i.ibb.co/gLRwhRNK/77804909-p0.png'); }
}

/* 公告栏 */
#notice {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 90%; max-width: 640px;
    background: rgba(10, 10, 20, 0.97); color: #ddd;
    padding: 32px 36px; border-radius: 14px;
    border: 1px solid rgba(255,255,255,.15);
    box-shadow: 0 0 40px rgba(0,0,0,.6);
    font-size: 14px; line-height: 1.7; text-align: center;
    z-index: 999999; opacity: 0; visibility: hidden;
    transition: opacity .4s ease, visibility .4s ease;
}
#notice.show { opacity: 1; visibility: visible; }
#notice button { margin-top: 22px; background: #e74c3c; border: none; color: #fff; padding: 10px 22px; border-radius: 6px; cursor: pointer; font-size: 14px; }
#notice button:disabled { background: #666; cursor: not-allowed; }

/* 排行榜容器 */
.container {
    width: 100%; max-width: 900px;
    background: transparent;
    border: 1px solid var(--border-color);
    border-radius: 16px;
    box-shadow: 0 0 50px rgba(0, 100, 255, 0.1);
    overflow: visible;
}

.header { text-align: center; padding: 30px; background: rgba(0, 0, 0, 0.3); border-bottom: 1px solid var(--border-color); }
.header h1 { font-family: 'Orbitron', sans-serif; font-size: 2.5rem; font-weight: 900; background: linear-gradient(135deg, #ff4d4d, #ff2d55, #ff9500); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-shadow: 0 0 20px rgba(255, 45, 85, 0.5); }
.header p { color: var(--text-secondary); margin-top: 10px; font-size: 0.9rem; }

.ranking-list { padding: 20px; position: relative; overflow: visible; }

.rank-item {
    display: grid; grid-template-columns: 60px 1fr 100px;
    align-items: center; padding: 18px 20px; margin-bottom: 12px;
    background: transparent; border-radius: 12px;
    border-left: 4px solid transparent; transition: all 0.3s ease;
    position: relative; overflow: visible; cursor: pointer;
}
.rank-item:hover { background: rgba(255, 255, 255, 0.05); transform: translateY(-3px); }

.rank-item.rank-1 { border-left-color: var(--gold); animation: glow-gold 2s infinite alternate; }
.rank-item.rank-2 { border-left-color: var(--silver); animation: glow-silver 2s infinite alternate; }
.rank-item.rank-3 { border-left-color: var(--bronze); animation: glow-bronze 2s infinite alternate; }

@keyframes glow-gold { from { box-shadow: 0 0 10px rgba(255, 215, 0, 0.3); } to { box-shadow: 0 0 20px rgba(255, 215, 0, 0.6); } }
@keyframes glow-silver { from { box-shadow: 0 0 10px rgba(192, 192, 192, 0.3); } to { box-shadow: 0 0 20px rgba(192, 192, 192, 0.6); } }
@keyframes glow-bronze { from { box-shadow: 0 0 10px rgba(205, 127, 50, 0.3); } to { box-shadow: 0 0 10px rgba(205, 127, 50, 0.6); } }

.rank-number { font-family: 'Orbitron', sans-serif; font-size: 1.8rem; font-weight: 900; text-align: center; }
.rank-1 .rank-number { color: var(--gold); text-shadow: 0 0 10px var(--gold); }
.rank-2 .rank-number { color: var(--silver); text-shadow: 0 0 10px var(--silver); }
.rank-3 .rank-number { color: var(--bronze); text-shadow: 0 0 10px var(--bronze); }
.rank-number.others { color: var(--rank-other-color); text-shadow: 0 0 8px var(--rank-other-color); }

.rank-item .rank-number.others ~ .player-info .player-name { font-weight: 800; }

.player-grade { font-family: 'Orbitron', sans-serif; font-weight: bold; font-size: 1.4rem; text-align: right; color: #4cd964; cursor: help; position: relative; }
.player-grade::after {
    content: attr(data-hint); position: absolute; bottom: 130%; right: 0;
    background: rgba(0,0,0,.95); color: #fff; padding: 10px 14px;
    border-radius: 6px; font-size: .85rem; white-space: normal;
    min-width: 160px; max-width: 260px;
    opacity: 0; visibility: hidden; transition: .3s; z-index: 9999;
}
.player-grade:hover::after { opacity: 1; visibility: visible; }

.player-info { display: flex; flex-direction: column; gap: 5px; }
.player-name.elite { font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 1.3rem; background: var(--elite-gradient); background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: shine 3s linear infinite; }
@keyframes shine { to { background-position: 200% center; } }
.player-name.member { color: #a0a0ff; }
.player-name.trial { color: #707090; }
.player-name.glitch { font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 1.4rem; color: var(--glitch-color-2); animation: glitch-effect 1s infinite; text-shadow: 2px 2px 0 var(--glitch-color-1), -2px -2px 0 blue; }
@keyframes glitch-effect {
    0% { transform: translate(0); text-shadow: 2px 2px 0 red, -2px -2px 0 blue; }
    20% { transform: translate(-2px, 2px); text-shadow: -2px -2px 0 blue, 2px 2px 0 white; }
    40% { transform: translate(2px, -2px); text-shadow: 2px -2px 0 red, -2px 2px 0 blue; }
    60% { transform: translate(-2px, -2px); text-shadow: -2px 2px 0 white, 2px -2px 0 blue; }
    80% { transform: translate(2px, 2px); text-shadow: 2px 2px 0 blue, -2px -2px 0 red; }
    100% { transform: translate(0); text-shadow: 2px 2px 0 red, -2px -2px 0 blue; }
}
.player-id { font-size: 0.85rem; color: var(--text-secondary); }

.footer { text-align: center; padding: 20px; font-size: 0.8rem; color: #555; border-top: 1px solid var(--border-color); margin-top: 20px; }

/* =========================================
   搜索栏（新增）
   ========================================= */
.search-wrap {
    position: fixed; top: 16px; left: 16px; z-index: 99999;
    width: 210px;
}
.search-input {
    width: 100%; padding: 6px 14px; font-size: 13px;
    background: rgba(10, 10, 30, 0.65); backdrop-filter: blur(8px);
    border: 1px solid rgba(0, 200, 255, 0.25); border-radius: 20px;
    color: var(--text-primary); outline: none;
}
.search-input::placeholder { color: rgba(255, 255, 255, 0.45); }
.search-results {
    margin-top: 6px; border-radius: 10px; overflow: hidden;
    background: rgba(10, 10, 30, 0.7); backdrop-filter: blur(8px);
    display: none;
}
.search-results.active { display: block; }
.search-item {
    padding: 7px 14px; cursor: pointer; font-size: 13px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    color: var(--text-primary);
}
.search-item:hover { background: rgba(0, 200, 255, 0.15); }

/* =========================================
   详情弹窗（新增）
   ========================================= */
.modal-mask {
    position: fixed; inset: 0; z-index: 999999;
    background: rgba(0, 0, 0, 0.6); display: none;
    align-items: center; justify-content: center;
}
.modal-mask.active { display: flex; }
.modal {
    width: 340px; background: rgba(10, 10, 30, 0.75); backdrop-filter: blur(14px);
    border-radius: 16px; border: 1px solid var(--border-color);
    padding: 24px; position: relative;
}
.modal-close { position: absolute; right: 14px; top: 10px; cursor: pointer; font-size: 18px; opacity: .7; color: #fff; }
.modal-close:hover { opacity: 1; }

.badge {
    width: 72px; height: 72px; border-radius: 50%;
    display: grid; place-items: center; font-size: 28px; font-weight: 900;
    margin: 0 auto 14px; font-family: 'Orbitron', sans-serif;
}
.badge.gold { background: linear-gradient(135deg, #ffd700, #ffaa00); color: #fff; box-shadow: 0 0 20px rgba(255, 215, 0, 0.5); }
.badge.silver { background: linear-gradient(135deg, #e0e0e0, #aaa); color: #333; box-shadow: 0 0 20px rgba(192, 192, 192, 0.5); }
.badge.bronze { background: linear-gradient(135deg, #cd7f32, #a86a28); color: #fff; box-shadow: 0 0 20px rgba(205, 127, 50, 0.5); }
.badge.normal { background: linear-gradient(135deg, rgba(0,229,255,0.2), rgba(0,136,204,0.2)); color: var(--rank-other-color); border: 1px solid rgba(0,229,255,0.3); }

.modal-name { text-align: center; font-size: 1.3rem; margin-bottom: 4px; }
.modal-role { text-align: center; opacity: .8; font-size: 14px; color: var(--text-secondary); margin-bottom: 16px; }

.info-card {
    background: rgba(0, 0, 0, 0.3); border-radius: 10px; padding: 14px;
    font-size: 14px; line-height: 1.8;
}
.info-card p { display: flex; justify-content: space-between; align-items: center; }
.info-card .label { color: var(--text-secondary); }
.info-card .value { font-weight: 600; }

.progress-wrap { margin-top: 16px; }
.progress-label { display: flex; justify-content: space-between; font-size: 12px; opacity: .7; margin-bottom: 4px; }
.progress-bar { height: 8px; background: rgba(255,255,255,.12); border-radius: 6px; overflow: hidden; }
.progress-fill { height: 100%; background: linear-gradient(90deg, #00eaff, #0088cc); border-radius: 6px; transition: width .6s ease; }

/* =========================================
   左下角工具箱（新增）
   ========================================= */
.toolbox { position: fixed; bottom: 120px; left: 24px; z-index: 99999; }
.main-btn {
    width: 56px; height: 56px; border-radius: 50%;
    background: rgba(10, 10, 30, 0.65); backdrop-filter: blur(8px);
    border: 1px solid rgba(0, 200, 255, 0.25);
    display: grid; place-items: center; cursor: pointer; position: relative;
}
.main-btn svg { transition: .3s; color: var(--accent, #00eaff); }
.main-btn .close-icon { opacity: 0; transform: rotate(-90deg); position: absolute; font-size: 20px; color: #fff; transition: .3s; }
.toolbox.open .main-btn .gear-icon { opacity: 0; transform: rotate(90deg); }
.toolbox.open .main-btn .close-icon { opacity: 1; transform: rotate(0); }

.child-icons { position: absolute; inset: 0; pointer-events: none; }
.child {
    position: absolute; width: 42px; height: 42px; border-radius: 50%;
    background: rgba(10, 10, 30, 0.7); border: 1px solid rgba(0, 200, 255, 0.3);
    display: grid; place-items: center; overflow: hidden;
    opacity: 0; transform: scale(0);
    transition: .35s cubic-bezier(.68, -.55, .27, 1.55);
    pointer-events: auto;
}
.child img { width: 22px; height: 22px; object-fit: contain; display: block; }
.child svg { width: 20px; height: 20px; }
/* 图片加载失败隐藏 */
.child img:not([src]), .child img[src=""] { visibility: hidden; }
.child img[src]:not([src=""]) + .child-fallback { display: none; }

.toolbox.open .child:nth-child(1) {
    opacity: 1; transform: scale(1) translate(62px, -42px); transition-delay: .05s;
}
.toolbox.open .child:nth-child(2) {
    opacity: 1; transform: scale(1) translate(74px, 0); transition-delay: .1s;
}
.toolbox.open .child:nth-child(3) {
    opacity: 1; transform: scale(1) translate(62px, 42px); transition-delay: .15s;
}

.child::after {
    content: attr(data-tip);
    position: absolute; left: 110%; top: 50%; transform: translateY(-50%);
    white-space: nowrap; font-size: 12px;
    background: rgba(0, 0, 0, .75); padding: 4px 10px; border-radius: 6px;
    opacity: 0; transition: .2s; pointer-events: none; color: #fff;
}
.child:hover::after { opacity: 1; }

/* 高亮动画 */
@keyframes pulse {
    0%, 100% { background: transparent; }
    50% { background: rgba(0, 230, 255, 0.25); }
}
.rank-item.highlight { animation: pulse .8s ease 2; }

@media (max-width: 520px) {
    .ranking-list { padding: 10px; }
    .rank-item { grid-template-columns: 40px 1fr 80px; padding: 12px 14px; }
    .search-wrap { width: 180px; }
}
</style>
</head>

<body>

<!-- 背景 -->
<img class="bg-img" alt="Background">
<div class="bg-overlay"></div>

<!-- 搜索栏 -->
<div class="search-wrap">
    <input class="search-input" id="searchInput" placeholder="搜索玩家名 / 排名">
    <div class="search-results" id="searchResults"></div>
</div>

<!-- 公告栏 -->
<div id="notice">
    本排行榜纯属娱乐，请勿过度解读。<br>
    数据仅供公会内部交流，不代表官方立场。<br>
    排名波动属正常现象，不构成任何评价依据。<br>
    如有异议，请以"都是演的"心态看待 😄
    <br><br>
    <button id="closeNotice" disabled>请阅读 5 秒 (5)</button>
</div>

<!-- 排行榜 -->
<div class="container">
    <div class="header">
        <h1>POME 剑术 PVP 榜</h1>
        等级 D5 ~ A1 | 悬停查看备注 | 荣耀归于胜者
    </div>
    <div class="ranking-list" id="rankingList"></div>
    <div class="footer">
        POME工会 © 2026 | q群：984791456 | 数据实时更新
    </div>
</div>

<!-- 详情弹窗 -->
<div class="modal-mask" id="modalMask">
    <div class="modal">
        <span class="modal-close" id="modalClose">✕</span>
        <div id="modalContent"></div>
    </div>
</div>

<!-- 左下角工具箱 -->
<div class="toolbox" id="toolbox">
    <div class="main-btn">
        <!-- 齿轮图标 -->
        <svg class="gear-icon" viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06A1.65 1.65 0 0 0 15 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 9 15a1.65 1.65 0 0 0-1.82-.33l-.06-.06a2 2 0 1 1-2.83 2.83l.06.06"/>
        </svg>
        <span class="close-icon">✕</span>

        <div class="child-icons">
            <!-- GitHub 第1个 -->
            <a class="child" data-tip="GitHub" href="https://github.com/pome-head/POME_sword-rank#" target="_blank">
                <svg viewBox="0 0 24 24" fill="#fff"><path d="M12 2C6.48 2 2 6.58 2 12.26c0 4.5 2.87 8.31 6.84 9.66.5.09.68-.22.68-.48 0-.24-.01-.87-.01-1.71-2.78.62-3.37-1.39-3.37-1.39-.45-1.18-1.11-1.49-1.11-1.49-.91-.64.07-.63.07-.63 1 .07 1.53 1.06 1.53 1.06.9 1.57 2.36 1.12 2.94.85.09-.67.35-1.12.63-1.38-2.22-.26-4.56-1.14-4.56-5.08 0-1.12.39-2.04 1.03-2.76-.1-.26-.45-1.3.1-2.71 0 0 .84-.27 2.75 1.05A9.2 9.2 0 0 1 12 6.8c.85 0 1.71.12 2.51.35 1.9-1.32 2.74-1.05 2.74-1.05.55 1.41.2 2.45.1 2.71.64.72 1.03 1.64 1.03 2.76 0 3.95-2.34 4.82-4.57 5.07.36.32.68.94.68 1.9 0 1.37-.01 2.48-.01 2.82 0 .27.18.58.69.48A10 10 0 0 0 22 12.26C22 6.58 17.52 2 12 2z"/></svg>
            </a>
            <!-- EC 第2个 -->
            <a class="child" data-tip="EaseCation" href="https://www.easecation.net/" target="_blank">
                <img src="ec-icon.png" alt="" onerror="this.style.opacity=0">
            </a>
            <!-- 布吉岛 第3个 -->
            <a class="child" data-tip="布吉岛" href="https://mcbjd.net/" target="_blank">
                <img src="bujidao-icon.png" alt="" onerror="this.style.opacity=0">
            </a>
        </div>
    </div>
</div>

<script>
/* =========================================
   公告栏（原逻辑未改）
   ========================================= */
let s = 5, btn = document.getElementById("closeNotice");
const notice = document.getElementById("notice");
notice.classList.add("show");
const t = setInterval(() => {
    s--; btn.textContent = s > 0 ? `请阅读 5 秒 (${s})` : "我知道了";
    if (s <= 0) { clearInterval(t); btn.disabled = false; }
}, 1000);
btn.onclick = () => notice.classList.remove("show");

/* =========================================
   排行榜数据 & 排序（原逻辑未改）
   ========================================= */
const players = [
    { name: "null", grade: "A1", role: "？？？", hint: "未知存在，数据读取失败..." },
    { name: "pome彡遗丿忘", grade: "C3", role: "会长", hint: "最佳成绩" },
    { name: "pome彡逸丿秋", grade: "D1", role: "精英", hint: "退休" },
    { name: "pome彡仁丿鸡", grade: "D1", role: "精英", hint: "最佳成绩" },
    { name: "也曾与之并肩", grade: "D2", role: "精英", hint: "退休" },
    { name: "pome彡胡丿桃", grade: "D3", role: "精英", hint: "退休" },
    { name: "pome彡摔丿鸽", grade: "D3", role: "精英", hint: "退休" },
    { name: "pome雨", grade: "D3", role: "会员", hint: "最佳成绩" },
    { name: "pome彡猫丿漿", grade: "--", role: "会员", hint: "还没有成绩哦" },
    { name: "他始终是过客", grade: "--", role: "成员", hint: "还没有成绩哦" },
    { name: "克莱因蓝_狼", grade: "--", role: "成员", hint: "还没有成绩哦" },
    { name: "浙江的猫猫", grade: "--", role: "成员", hint: "还没有成绩哦" },
    { name: "pome彡落丿衡", grade: "--", role: "成员", hint: "还没有成绩哦" },
    { name: "pome彡心丿碎", grade: "--", role: "成员", hint: "还没有成绩哦" }
];

const gradeOrder = {};
["D5","D4","D3","D2","D1","C5","C4","C3","C2","C1","B5","B4","B3","B2","B1","A5","A4","A3","A2","A1"]
.forEach((g,i)=>gradeOrder[g]=i);
const roleOrder = {"？？？":6,"会长":5,"精英":4,"会员":3,"成员":2};

players.sort((a,b)=>{
    const g = (gradeOrder[b.grade]||-1)-(gradeOrder[a.grade]||-1);
    if(g!==0) return g;
    return roleOrder[b.role]-roleOrder[a.role];
});

/* =========================================
   渲染排行榜 + 绑定点击 → 详情页
   ========================================= */
const listEl = document.getElementById("rankingList");
players.forEach((p,i)=>{
    const r = i + 1;
    const d = document.createElement("div");
    d.className = `rank-item ${r===1?'rank-1':r===2?'rank-2':r===3?'rank-3':''}`;
    d.dataset.rank = r;
    d.innerHTML = `
        <div class="rank-number ${r>3?'others':''}">${String(r).padStart(2,'0')}</div>
        <div class="player-info">
            <div class="player-name ${
                p.role==='？？？'?'glitch':
                p.role==='会长'||p.role==='精英'?'elite':
                p.role==='会员'?'member':'trial'
            }">${p.name}</div>
            <div class="player-id">${p.role}</div>
        </div>
        <div class="player-grade" data-hint="${p.hint}">${p.grade}</div>
    `;
    // 点击行 → 打开详情
    d.addEventListener('click', () => openModal(p, r));
    listEl.appendChild(d);
});

/* =========================================
   搜索功能
   ========================================= */
const searchInput = document.getElementById("searchInput");
const searchResults = document.getElementById("searchResults");

searchInput.addEventListener('input', () => {
    const v = searchInput.value.trim();
    searchResults.innerHTML = '';
    if (!v) { searchResults.classList.remove('active'); return; }

    const res = players.filter((p, i) =>
        p.name.includes(v) || (i + 1) === Number(v)
    ).slice(0, 6);

    if (!res.length) { searchResults.classList.remove('active'); return; }

    res.forEach((p, idx) => {
        const actualRank = players.indexOf(p) + 1;
        const div = document.createElement('div');
        div.className = 'search-item';
        div.textContent = `#${actualRank} ${p.name}`;
        div.addEventListener('click', () => {
            openModal(p, actualRank);
            // 高亮对应行
            document.querySelectorAll('.rank-item').forEach(r => r.classList.remove('highlight'));
            const target = document.querySelector(`.rank-item[data-rank="${actualRank}"]`);
            if (target) {
                target.classList.add('highlight');
                target.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
            searchResults.classList.remove('active');
            searchInput.blur();
        });
        searchResults.appendChild(div);
    });
    searchResults.classList.add('active');
});

// 点击空白处关闭搜索结果
document.addEventListener('click', (e) => {
    if (!e.target.closest('.search-wrap')) {
        searchResults.classList.remove('active');
    }
});

/* =========================================
   详情弹窗
   ========================================= */
const modalMask = document.getElementById("modalMask");
const modalContent = document.getElementById("modalContent");

function badgeClass(rank) {
    if (rank === 1) return 'gold';
    if (rank === 2) return 'silver';
    if (rank === 3) return 'bronze';
    return 'normal';
}

function openModal(p, rank) {
    const total = players.length;
    const pct = ((rank / total) * 100).toFixed(1);
    const fillPct = ((1 - rank / total) * 100).toFixed(1);

    modalContent.innerHTML = `
        <div class="badge ${badgeClass(rank)}">#${rank}</div>
        <div class="modal-name ${p.role==='？？？'?'glitch':p.role==='会长'||p.role==='精英'?'elite':p.role==='会员'?'member':'trial'}">${p.name}</div>
        <div class="modal-role">${p.role}</div>
        <div class="info-card">
            <p><span class="label">🎖 排名</span><span class="value">#${rank} / ${total}</span></p>
            <p><span class="label">⭐ 等级</span><span class="value">${p.grade}</span></p>
            <p><span class="label">📝 备注</span><span class="value">${p.hint}</span></p>
        </div>
        <div class="progress-wrap">
            <div class="progress-label">
                <span>排行进度</span>
                <span>前 ${pct}%</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" style="width: ${fillPct}%"></div>
            </div>
        </div>
    `;
    modalMask.classList.add('active');
}

document.getElementById("modalClose").addEventListener('click', () => {
    modalMask.classList.remove('active');
});
modalMask.addEventListener('click', (e) => {
    if (e.target === modalMask) modalMask.classList.remove('active');
});

/* =========================================
   工具箱
   ========================================= */
const toolbox = document.getElementById("toolbox");
toolbox.addEventListener('click', (e) => {
    e.stopPropagation();
    toolbox.classList.toggle('open');
});
document.addEventListener('click', (e) => {
    if (!e.target.closest('.toolbox')) toolbox.classList.remove('open');
});

/* =========================================
   快捷键
   ========================================= */
document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
        modalMask.classList.remove('active');
        searchResults.classList.remove('active');
        toolbox.classList.remove('open');
    }
    if (e.key === '/') { e.preventDefault(); searchInput.focus(); }
});
</script>

</body>
