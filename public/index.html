<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <!-- 关键：确保 viewport 正确，否则手机模式判断会失效 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>POME工会 - 剑术PVP排行榜</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">

  <style>
    :root {
        --bg-color: #0a0a0f;
        --border-color: rgba(0, 200, 255, 0.4);
        --text-primary: #e0e0ff;
        --text-secondary: #8888aa;
        --gold: #ffd700;
        --silver: #c0c0c0;
        --bronze: #cd7f32;
        --elite-gradient: linear-gradient(90deg, #ff4d4d, #f9cb28, #4cd964, #5ac8fa, #ff2d55);
        --glitch-color-1: #ff0000;
        --glitch-color-2: #ffffff;
        --rank-other-color: #00e5ff; /* 04及以后排名的数字颜色 */
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* =========================================
       背景图配置（终极修复：Img标签法）
       解决拼接 + 设备判断失效问题
       ========================================= */

    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        color: var(--text-primary);
        min-height: 100vh;
        padding: 40px 20px;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        position: relative;
        overflow-x: hidden;
    }

    /* 核心修复：用 img 标签做背景，彻底解决拼接 */
    .bg-img {
        position: fixed;
        top: 0; left: 0;
        width: 100vw;
        height: 100vh;
        object-fit: cover;
        z-index: -2;
        /* 默认显示 PC 背景图 */
        content: url('https://i.ibb.co/dsbcH0ZG/20200923154240-7324b.png');
    }

    /* 遮罩层 */
    .bg-overlay {
        position: fixed;
        inset: 0;
        background: rgba(10, 10, 20, 0.25);
        z-index: -1;
    }

    /*
     * 手机横屏（核心修正）
     * 覆盖绝大多数手机：iPhone 12+ / Android
     * 条件：屏幕较窄（< 850px）且 宽高比为 16:9 或 18:9
     */
    @media (max-width: 850px) and (aspect-ratio: 16/9),
           (max-width: 850px) and (aspect-ratio: 18/9) {
        .bg-img {
            content: url('https://i.ibb.co/dsbcH0ZG/20200923154240-7324b.png');
        }
    }

    /* 手机竖屏 */
    @media (max-width: 768px) and (orientation: portrait) {
        .bg-img {
            content: url('https://i.ibb.co/27fCXKpx/20201026223348-c19cb.jpg');
        }
    }

    /* =========================================
       公告栏
       ========================================= */
    #notice {
        position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
        width: 90%; max-width: 640px;
        background: rgba(10, 10, 20, 0.97); color: #ddd;
        padding: 32px 36px; border-radius: 14px;
        border: 1px solid rgba(255,255,255,.15);
        box-shadow: 0 0 40px rgba(0,0,0,.6);
        font-size: 14px; line-height: 1.7; text-align: center;
        z-index: 999999; opacity: 0; visibility: hidden;
        transition: opacity .4s ease, visibility .4s ease;
    }
    #notice.show { opacity: 1; visibility: visible; }
    #notice button { margin-top: 22px; background: #e74c3c; border: none; color: #fff; padding: 10px 22px; border-radius: 6px; cursor: pointer; font-size: 14px; }
    #notice button:disabled { background: #666; cursor: not-allowed; }

    /* =========================================
       排行榜容器（透明 + 边框）
       ========================================= */
    .container {
        width: 100%; max-width: 900px;
        background: transparent; 
        border: 1px solid var(--border-color);
        border-radius: 16px; 
        box-shadow: 0 0 50px rgba(0, 100, 255, 0.1); 
        overflow: visible;
    }

    .header { text-align: center; padding: 30px; background: rgba(0, 0, 0, 0.3); border-bottom: 1px solid var(--border-color); }
    .header h1 { font-family: 'Orbitron', sans-serif; font-size: 2.5rem; font-weight: 900; background: linear-gradient(135deg, #ff4d4d, #ff2d55, #ff9500); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-shadow: 0 0 20px rgba(255, 45, 85, 0.5); }
    .header p { color: var(--text-secondary); margin-top: 10px; font-size: 0.9rem; }

    .ranking-list { padding: 20px; position: relative; overflow: visible; }

    .rank-item {
        display: grid; grid-template-columns: 60px 1fr 100px;
        align-items: center; padding: 18px 20px; margin-bottom: 12px;
        background: transparent;
        border-radius: 12px;
        border-left: 4px solid transparent; transition: all 0.3s ease;
        position: relative; overflow: visible;
    }
    .rank-item:hover { background: rgba(255, 255, 255, 0.05); transform: translateY(-3px); }

    .rank-item.rank-1 { border-left-color: var(--gold); animation: glow-gold 2s infinite alternate; }
    .rank-item.rank-2 { border-left-color: var(--silver); animation: glow-silver 2s infinite alternate; }
    .rank-item.rank-3 { border-left-color: var(--bronze); animation: glow-bronze 2s infinite alternate; }

    @keyframes glow-gold { from { box-shadow: 0 0 10px rgba(255, 215, 0, 0.3); } to { box-shadow: 0 0 20px rgba(255, 215, 0, 0.6); } }
    @keyframes glow-silver { from { box-shadow: 0 0 10px rgba(192, 192, 192, 0.3); } to { box-shadow: 0 0 20px rgba(192, 192, 192, 0.6); } }
    @keyframes glow-bronze { from { box-shadow: 0 0 10px rgba(205, 127, 50, 0.3); } to { box-shadow: 0 0 20px rgba(205, 127, 50, 0.6); } }

    .rank-number { 
        font-family: 'Orbitron', sans-serif; 
        font-size: 1.8rem; 
        font-weight: 900; 
        text-align: center; 
    }
    .rank-1 .rank-number { color: var(--gold); text-shadow: 0 0 10px var(--gold); }
    .rank-2 .rank-number { color: var(--silver); text-shadow: 0 0 10px var(--silver); }
    .rank-3 .rank-number { color: var(--bronze); text-shadow: 0 0 10px var(--bronze); }
    
    /* 修改点：04及以后排名的数字样式 */
    .rank-number.others { 
        color: var(--rank-other-color); 
        text-shadow: 0 0 8px var(--rank-other-color);
    }

    /* 修改点：04及以后排名的名字样式（仅加粗） */
    .rank-item .rank-number.others ~ .player-info .player-name {
        font-weight: 800; /* 加粗 */
    }

    .player-grade {
        font-family: 'Orbitron', sans-serif; font-weight: bold; font-size: 1.4rem;
        text-align: right; color: #4cd964; cursor: help; position: relative;
    }
    .player-grade::after {
        content: attr(data-hint); position: absolute; bottom: 130%; right: 0;
        background: rgba(0,0,0,.95); color: #fff; padding: 10px 14px;
        border-radius: 6px; font-size: .85rem; white-space: normal;
        min-width: 160px; max-width: 260px;
        opacity: 0; visibility: hidden; transition: .3s; z-index: 9999;
    }
    .player-grade:hover::after { opacity: 1; visibility: visible; }

    .player-info { display: flex; flex-direction: column; gap: 5px; }
    .player-name.elite { font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 1.3rem; background: var(--elite-gradient); background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: shine 3s linear infinite; }
    @keyframes shine { to { background-position: 200% center; } }
    .player-name.member { color: #a0a0ff; }
    .player-name.trial { color: #707090; }
    .player-name.glitch { font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 1.4rem; color: var(--glitch-color-2); animation: glitch-effect 1s infinite; text-shadow: 2px 2px 0 var(--glitch-color-1), -2px -2px 0 blue; }
    @keyframes glitch-effect {
        0% { transform: translate(0); text-shadow: 2px 2px 0 red, -2px -2px 0 blue; }
        20% { transform: translate(-2px, 2px); text-shadow: -2px -2px 0 blue, 2px 2px 0 white; }
        40% { transform: translate(2px, -2px); text-shadow: 2px -2px 0 red, -2px 2px 0 blue; }
        60% { transform: translate(-2px, -2px); text-shadow: -2px 2px 0 white, 2px -2px 0 blue; }
        80% { transform: translate(2px, 2px); text-shadow: 2px 2px 0 blue, -2px -2px 0 red; }
        100% { transform: translate(0); text-shadow: 2px 2px 0 red, -2px -2px 0 blue; }
    }
    .player-id { font-size: 0.85rem; color: var(--text-secondary); }

    .footer { text-align: center; padding: 20px; font-size: 0.8rem; color: #555; border-top: 1px solid var(--border-color); margin-top: 20px; }
  </style>
</head>

<body>

  <!-- 核心修复：Img 标签做背景，永不拼接 -->
  <img class="bg-img" alt="Background">
  <div class="bg-overlay"></div>

  <div id="notice">
      本排行榜纯属娱乐，请勿过度解读。
      数据仅供公会内部交流，不代表官方立场。
      排名波动属正常现象，不构成任何评价依据。
      如有异议，请以"都是演的"心态看待 😄
      
      <button id="closeNotice" disabled>请阅读 5 秒 (5)</button>
  </div>

  <div class="container">
      <div class="header">
          <h1>POME 剑术 PVP 榜</h1>
          等级 D5 ~ A1 | 悬停查看备注 | 荣耀归于胜者
      </div>

      <div class="ranking-list" id="rankingList"></div>

      <div class="footer">
          POME工会 © 2026 | q群：984791456 | 数据实时更新
      </div>
  </div>

  <script>
    let s = 5, btn = document.getElementById("closeNotice");
    const notice = document.getElementById("notice");
    notice.classList.add("show");
    const t = setInterval(() => {
        s--; btn.textContent = s > 0 ? `请阅读 5 秒 (${s})` : "我知道了";
        if (s <= 0) { clearInterval(t); btn.disabled = false; }
    }, 1000);
    btn.onclick = () => notice.classList.remove("show");

    const players = [
        { name: "null", grade: "A1", role: "？？？", hint: "未知存在，数据读取失败..." },
        { name: "pome彡遗丿忘", grade: "C3", role: "会长", hint: "最佳成绩" },
        { name: "pome彡逸丿秋", grade: "D1", role: "精英", hint: "退休" },
        { name: "pome彡仁丿鸡", grade: "D1", role: "精英", hint: "最佳成绩" },
        { name: "也曾与之并肩", grade: "D2", role: "精英", hint: "退休" },
        { name: "pome彡胡丿桃", grade: "D3", role: "精英", hint: "退休" },
        { name: "pome彡摔丿鸽", grade: "D3", role: "精英", hint: "退休" },
        { name: "pome雨", grade: "D3", role: "会员", hint: "最佳成绩" },
        { name: "pome彡猫丿漿", grade: "--", role: "会员", hint: "还没有成绩哦" },
        { name: "他始终是过客", grade: "--", role: "成员", hint: "还没有成绩哦" },
        { name: "克莱因蓝_狼", grade: "--", role: "成员", hint: "还没有成绩哦" },
        { name: "浙江的猫猫", grade: "--", role: "成员", hint: "还没有成绩哦" },
        { name: "pome彡落丿衡", grade: "--", role: "成员", hint: "还没有成绩哦" },
        { name: "pome彡心丿碎", grade: "--", role: "成员", hint: "还没有成绩哦" }
    ];

    const gradeOrder = {};
    ["D5","D4","D3","D2","D1","C5","C4","C3","C2","C1","B5","B4","B3","B2","B1","A5","A4","A3","A2","A1"]
    .forEach((g,i)=>gradeOrder[g]=i);
    const roleOrder = {"？？？":6,"会长":5,"精英":4,"会员":3,"成员":2};

    players.sort((a,b)=>{
        const g = (gradeOrder[b.grade]||-1)-(gradeOrder[a.grade]||-1);
        if(g!==0) return g;
        return roleOrder[b.role]-roleOrder[a.role];
    });

    const listEl = document.getElementById("rankingList");
    players.forEach((p,i)=>{
        const r=i+1;
        const d=document.createElement("div");
        d.className=`rank-item ${r===1?'rank-1':r===2?'rank-2':r===3?'rank-3':''}`;
        d.innerHTML=`
            <div class="rank-number ${r>3?'others':''}">${String(r).padStart(2,'0')}</div>
            <div class="player-info">
                <div class="player-name ${
                    p.role==='？？？'?'glitch':
                    p.role==='会长'||p.role==='精英'?'elite':
                    p.role==='会员'?'member':'trial'
                }">${p.name}</div>
                <div class="player-id">${p.role}</div>
            </div>
            <div class="player-grade" data-hint="${p.hint}">${p.grade}</div>
        `;
        listEl.appendChild(d);
    });
  </script>

</body>
</html>
